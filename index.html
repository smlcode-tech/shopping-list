<!doctype html>
<html lang='tr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#FFF4E0'>
<title>Alışveriş Listesi</title>
<link rel='icon' href='assets/favicon.svg' type='image/svg+xml'>
<link rel='icon' href='assets/favicon.ico' sizes='32x32'>
<link rel='apple-touch-icon' href='assets/apple-touch-icon.png'>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Pixelify+Sans:wght@500;600;700&display=swap'>
<style>
:root{--page:#FFF4E0;--dots:#F2E0BF;--card:#FFFBF3;--input:#FFFFFF;--fg:#3B2418;--line:#3B2418;--soft:#EBD9BA;--muted:#7A5A45;--muted-bg:#FBE8C8;--thumb:#D9B98A;--pink:#D6334F;--pink-fg:#FFFFFF;--lemon:#F7C948;--mint:#7BD3A8;--sky:#79C7F2;--lav:#B9A6F2;--rose:#F7A8B8;--err:#B3261E;--focus:#2F8FE0}
@media(prefers-color-scheme:dark){:root{--page:#241613;--dots:#2E1D19;--card:#33211C;--input:#2A1A16;--fg:#FFF1D6;--line:#0E0706;--soft:#4A332B;--muted:#C9AA93;--muted-bg:#3E2923;--thumb:#6B4A3C;--err:#FF9A8F}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);background-size:20px 20px;color:var(--fg);font:600 15px/1.5 'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.px{font-family:'Pixelify Sans','Nunito',system-ui,sans-serif;font-weight:600}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:var(--page);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Pixelify Sans','Nunito',sans-serif;font-size:22px;font-weight:600;white-space:nowrap}
.logo{width:36px;height:36px;display:block;image-rendering:pixelated}
.right{display:flex;align-items:center;gap:12px}
.email{color:var(--muted)}
.btn{height:40px;padding:0 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--pink);color:var(--pink-fg)}
.total{white-space:nowrap;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:var(--lemon);color:#3B2418;box-shadow:3px 3px 0 var(--line)}
.total span{font-size:13px;font-weight:800;opacity:.75}
.total strong{font-family:'Nunito',system-ui,sans-serif;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bump{animation:bump .4s}
main{max-width:768px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:28px}
.sub{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--line);overflow:hidden}
.add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:20px;position:relative}
.add::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--pink) 0 24px,var(--lemon) 24px 48px,var(--mint) 48px 72px,var(--sky) 72px 96px,var(--lav) 96px 120px)}
.add{padding-top:28px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.f-name{flex:1 1 220px}
.f-price{flex:0 1 140px}
input,select{height:42px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--input);font-weight:700}
select{cursor:pointer}
input{width:100%}
input::placeholder{color:var(--muted);opacity:.8;font-weight:600}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h3{font-family:'Pixelify Sans','Nunito',sans-serif;font-size:22px;font-weight:600}
.pill{padding:2px 12px;border:2px solid var(--line);border-radius:999px;background:var(--muted-bg);font-size:13px;font-weight:800;color:var(--fg)}
.cols{display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 100px 0 20px;background:var(--muted-bg);border-top:2px solid var(--line);border-bottom:2px solid var(--line);font-family:'Pixelify Sans','Nunito',sans-serif;font-size:14px;color:var(--muted)}
.scroll{overflow-y:scroll;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
.scroll::-webkit-scrollbar{width:12px}
.scroll::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:8px;border:3px solid var(--card)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 4px 0 18px;border-bottom:2px dashed var(--soft)}
li::before{content:'';flex:none;width:14px;height:14px;border:2px solid var(--line);border-radius:4px;background:var(--mint)}
li:nth-child(5n+2)::before{background:var(--sky)}
li:nth-child(5n+3)::before{background:var(--lemon)}
li:nth-child(5n+4)::before{background:var(--lav)}
li:nth-child(5n+5)::before{background:var(--rose)}
li .n{flex:1;min-width:0;font-weight:700;word-break:break-word}
li .p{font-weight:800;font-variant-numeric:tabular-nums}
li.empty{flex-direction:column;justify-content:center;gap:6px;color:var(--muted);padding:20px;border-bottom:0;min-height:0}
li.empty::before{display:none}
li.empty img{width:56px;height:56px;image-rendering:pixelated}
li.pop{animation:pop .35s}
.acts{display:flex;flex:none}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--muted-bg);color:var(--fg)}
.ib:disabled{opacity:.5;cursor:default}
.ib.ok{color:var(--fg)}
.ei{height:40px;padding:0 10px}
.ei-name{flex:1;min-width:0;width:auto}
.ei-price{width:96px;flex:none}
.pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:2px solid var(--line)}
.pager .l,.pager .r{display:flex;align-items:center;gap:10px}
.info{white-space:nowrap;min-width:7ch;text-align:right;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
.msg{color:var(--err);font-weight:800}
.msg:empty{display:none}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.lwrap{position:relative;width:100%;max-width:400px}
.lcard{width:100%;padding:36px 32px 32px;display:flex;flex-direction:column;gap:20px;align-items:stretch;text-align:center}
.lcard::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--pink) 0 24px,var(--lemon) 24px 48px,var(--mint) 48px 72px,var(--sky) 72px 96px,var(--lav) 96px 120px)}
.hero{width:96px;height:96px;margin:0 auto;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.lcard h1{font-family:'Pixelify Sans','Nunito',sans-serif;font-size:32px;font-weight:600;line-height:1.15}
.note{font-size:13px;color:var(--muted)}
.ph{position:absolute;z-index:2;width:21px;height:18px;fill:var(--pink);animation:float 3s ease-in-out infinite;pointer-events:none}
.ph.a{left:-14px;top:70px}
.ph.b{right:-12px;top:120px;animation-delay:.8s;fill:var(--lemon)}
.ph.c{right:40px;top:-14px;animation-delay:1.6s;fill:var(--sky)}
.gbtn{height:48px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #747775;border-radius:4px;background:#FFFFFF;color:#1F1F1F;font-weight:500;cursor:pointer;width:100%}
.gbtn:disabled{opacity:.6;cursor:default}
.gicon{width:20px;height:20px;flex:none}
.gicon svg{display:block}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none}}
@keyframes bump{40%{transform:scale(1.12) rotate(-2deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){.email{display:none}}
@media(max-width:520px){.top{padding:10px 16px}.brand{font-size:19px;gap:8px}.logo{width:30px;height:30px}.total{padding:0 12px}.total strong{font-size:17px}.right{gap:8px}main{padding:20px 16px 48px}}
@media(max-width:380px){.total span{display:none}}
@media(max-width:420px){.pager{flex-direction:column;align-items:stretch}.pager .l,.pager .r{justify-content:space-between}.pager .r{gap:6px}.pager .r .btn{padding:0 10px}.info{flex:1;text-align:left}}
@media(max-width:360px){.bt{display:none}.pager .r .btn{padding:0 12px}.ib{width:36px;height:40px}li{gap:8px;padding-left:12px}.cols{padding:0 80px 0 12px}}
@media(max-width:340px){.brand span{display:none}}
</style>
</head>
<body>
<section class='login' id='login' hidden>
<div class='lwrap'>
<svg class='ph a' viewBox='0 0 7 6' shape-rendering='crispEdges' aria-hidden='true'><path d='M1 0H3V1H4V0H6V1H7V3H6V4H5V5H4V6H3V5H2V4H1V3H0V1H1Z'></path></svg>
<svg class='ph b' viewBox='0 0 7 6' shape-rendering='crispEdges' aria-hidden='true'><path d='M1 0H3V1H4V0H6V1H7V3H6V4H5V5H4V6H3V5H2V4H1V3H0V1H1Z'></path></svg>
<svg class='ph c' viewBox='0 0 7 6' shape-rendering='crispEdges' aria-hidden='true'><path d='M1 0H3V1H4V0H6V1H7V3H6V4H5V5H4V6H3V5H2V4H1V3H0V1H1Z'></path></svg>
<div class='card lcard' style='position:relative'>
<img class='hero' src='assets/favicon.svg' alt=''>
<div><h1>Hoş geldin!</h1><p class='sub' style='margin-top:8px'>Alışveriş listene ulaşmak için Google hesabınla devam et.</p></div>
<button type='button' class='gbtn' id='loginBtn'>
<span class='gicon'><svg version='1.1' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' aria-hidden='true'>
<path fill='#EA4335' d='M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z'></path>
<path fill='#4285F4' d='M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z'></path>
<path fill='#FBBC05' d='M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z'></path>
<path fill='#34A853' d='M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z'></path>
<path fill='none' d='M0 0h48v48H0z'></path>
</svg></span>
<span>Google ile devam et</span>
</button>
<p class='msg' id='loginMsg' role='alert'></p>
<p class='note'>Listen yalnızca sana görünür.</p>
</div>
</div>
</section>

<div id='app' hidden>
<header class='top'>
<div class='brand'><img class='logo' src='assets/favicon.svg' alt=''><span>Listem</span></div>
<div class='right'>
<span class='email' id='email'></span>
<button type='button' class='btn' id='logoutBtn'>Çıkış</button>
<div class='total'><span>Toplam</span><strong id='total'>0,00 ₺</strong></div>
</div>
</header>
<main>
<div class='msg' id='msg' role='alert'></div>
<div class='card add'>
<label class='field f-name'>Ürün adı<input id='name' placeholder='Örn. Süt 1 L' autocomplete='off' maxlength='200'></label>
<label class='field f-price'>Fiyat (₺)<input id='price' placeholder='0,00' inputmode='decimal' autocomplete='off'></label>
<button type='button' class='btn btn-primary' id='addBtn'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 5v14M5 12h14'></path></svg>Ekle</button>
</div>
<div class='card'>
<div class='head'><h3>Sepetim</h3><p class='pill' id='count'>0 ürün</p></div>
<div class='cols'><span>Ürün</span><span>Fiyat</span></div>
<div class='scroll' id='scroll'><ul id='list'></ul></div>
<div class='pager'>
<div class='l'><label for='size' class='sub'>Sayfa başına</label><select id='size'><option value='5'>5</option><option value='10'>10</option><option value='20'>20</option><option value='50'>50</option></select></div>
<div class='r'><span class='info' id='pageInfo'></span>
<button type='button' class='btn' id='prev' aria-label='Önceki sayfa'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M15 6l-6 6 6 6'></path></svg><span class='bt'>Önceki</span></button>
<button type='button' class='btn' id='next' aria-label='Sonraki sayfa'><span class='bt'>Sonraki</span><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M9 6l6 6-6 6'></path></svg></button>
</div>
</div>
</div>
</main>
</div>

<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<script>
const sb=supabase.createClient('https://jcjfrbyfcudmhgdijzkf.supabase.co','sb_publishable_80IhijMoGlkJ6-lIef7snw_aK-x3j0I');
const ROW=52,MAXH=440;
let items=[],user=null,page=1,size=10,editingId=null,focusEdit=false,justAdded=null;
try{const s=Number(localStorage.getItem('pageSize'));if([5,10,20,50].includes(s))size=s}catch(e){}
const $=id=>document.getElementById(id);
const msg=t=>{$('msg').textContent=t||''};
const svg=d=>`<svg width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>${d}</svg>`;
const TRASH=svg(`<path d='M3 6h18'></path><path d='M8 6V4h8v2'></path><path d='M6 6l1 14h10l1-14'></path><path d='M10 11v6M14 11v6'></path>`);
const PENCIL=svg(`<path d='M12 20h9'></path><path d='M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z'></path>`);
const CHECK=svg(`<path d='M20 6L9 17l-5-5'></path>`);
const XICON=svg(`<path d='M18 6L6 18M6 6l12 12'></path>`);
const fmt=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const fmtInput=n=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
const parsePrice=s=>{s=s.split(' ').join('');if(s.includes(','))s=s.split('.').join('').replace(',','.');const v=parseFloat(s);return Number.isFinite(v)&&v>=0?v:NaN};
function iconBtn(icon,label,fn,cls){const b=document.createElement('button');b.type='button';b.className='ib'+(cls?' '+cls:'');b.setAttribute('aria-label',label);b.innerHTML=icon;b.onclick=fn;return b}
function updateUI(){
 $('login').hidden=!!user;$('app').hidden=!user;
 $('email').textContent=user?user.email:'';
 $('logoutBtn').title=user?user.email:'';
}
async function load(){
 const {data,error}=await sb.from('items').select('id,name,price').order('id',{ascending:true});
 if(error){msg('Liste yüklenemedi, sayfayı yenile.');return}
 items=data;msg('');render();
}
function render(){
 const pages=Math.max(1,Math.ceil(items.length/size));
 if(page>pages)page=pages;if(page<1)page=1;
 const start=(page-1)*size,slice=items.slice(start,start+size);
 $('scroll').style.height=Math.min(size*ROW,MAXH)+'px';
 const ul=$('list');ul.innerHTML='';
 if(!items.length){const d=document.createElement('li');d.className='empty';const im=document.createElement('img');im.src='assets/favicon.svg';im.alt='';const t=document.createElement('span');t.textContent='Sepetin boş, ilk ürünü ekle!';d.append(im,t);ul.appendChild(d)}
 slice.forEach(it=>{
  const li=document.createElement('li');
  const acts=document.createElement('div');acts.className='acts';
  if(it.id===editingId){
   const ni=document.createElement('input');ni.className='ei ei-name';ni.value=it.name;ni.maxLength=200;ni.setAttribute('aria-label','Ürün adı');
   const pi=document.createElement('input');pi.className='ei ei-price';pi.value=fmtInput(it.price);pi.inputMode='decimal';pi.setAttribute('aria-label','Fiyat');
   const save=iconBtn(CHECK,'Kaydet',()=>saveEdit(it.id,ni,pi,save),'ok');
   const cancel=iconBtn(XICON,'Vazgeç',cancelEdit);
   const onKey=e=>{if(e.key==='Enter')save.click();else if(e.key==='Escape')cancelEdit()};
   ni.onkeydown=onKey;pi.onkeydown=onKey;
   acts.append(save,cancel);li.append(ni,pi,acts);
   if(focusEdit){focusEdit=false;setTimeout(()=>ni.focus(),0)}
  }else{
   const n=document.createElement('span');n.className='n';n.textContent=it.name;
   const p=document.createElement('span');p.className='p';p.textContent=fmt(it.price);
   const edit=iconBtn(PENCIL,'Düzenle: '+it.name,()=>startEdit(it.id));
   const del=iconBtn(TRASH,'Sil: '+it.name,()=>remove(it.id,del));
   acts.append(edit,del);li.append(n,p,acts);
   if(it.id===justAdded){li.classList.add('pop');justAdded=null}
  }
  ul.appendChild(li);
 });
 const totalText=fmt(items.reduce((s,x)=>s+Number(x.price),0));
 if($('total').textContent!==totalText){
  $('total').textContent=totalText;
  const tb=document.querySelector('.total');tb.classList.remove('bump');void tb.offsetWidth;tb.classList.add('bump');
 }
 $('count').textContent=items.length+' ürün';
 $('size').value=String(size);
 $('pageInfo').textContent=items.length?(start+1)+'–'+(start+slice.length)+' / '+items.length:'0';
 $('prev').disabled=page<=1;$('next').disabled=page>=pages;
}
function startEdit(id){editingId=id;focusEdit=true;msg('');render()}
function cancelEdit(){editingId=null;render()}
async function saveEdit(id,ni,pi,btn){
 const name=ni.value.trim(),price=parsePrice(pi.value);
 if(!name){ni.focus();return}
 if(Number.isNaN(price)){pi.focus();return}
 btn.disabled=true;
 const {data,error}=await sb.from('items').update({name,price}).eq('id',id).select('id,name,price').single();
 if(error){msg('Güncellenemedi, tekrar dene.');btn.disabled=false;return}
 items=items.map(x=>x.id===id?data:x);editingId=null;msg('');render();
}
async function add(){
 const nameEl=$('name'),priceEl=$('price'),btn=$('addBtn');
 const name=nameEl.value.trim(),price=parsePrice(priceEl.value);
 if(!name){nameEl.focus();return}
 if(Number.isNaN(price)){priceEl.focus();return}
 btn.disabled=true;
 const {data,error}=await sb.from('items').insert({name,price}).select('id,name,price').single();
 if(error){msg('Eklenemedi, tekrar dene.')}
 else{items.push(data);editingId=null;justAdded=data.id;page=Math.ceil(items.length/size);msg('');render();$('scroll').scrollTop=$('scroll').scrollHeight;nameEl.value='';priceEl.value=''}
 btn.disabled=false;nameEl.focus();
}
async function remove(id,btn){
 btn.disabled=true;
 const {error}=await sb.from('items').delete().eq('id',id);
 if(error){msg('Silinemedi, tekrar dene.');btn.disabled=false;return}
 if(editingId===id)editingId=null;
 items=items.filter(x=>x.id!==id);msg('');render();
}
$('loginBtn').onclick=async()=>{
 $('loginMsg').textContent='';
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});
 if(error)$('loginMsg').textContent='Giriş başlatılamadı: '+error.message;
};
$('logoutBtn').onclick=()=>sb.auth.signOut();
$('addBtn').onclick=add;
$('size').onchange=e=>{size=Number(e.target.value);page=1;editingId=null;try{localStorage.setItem('pageSize',String(size))}catch(_){}render()};
$('prev').onclick=()=>{page--;editingId=null;render();$('scroll').scrollTop=0};
$('next').onclick=()=>{page++;editingId=null;render();$('scroll').scrollTop=0};
['name','price'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')add()}));
sb.auth.onAuthStateChange((_e,session)=>{
 user=session?session.user:null;updateUI();
 if(user){setTimeout(load,0)}else{items=[];page=1;editingId=null;render()}
});
render();
</script>
</body>
</html>
